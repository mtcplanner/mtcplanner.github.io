<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTC Planner — Filter Cross Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="../../pages/materialrequest/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="mr-header">
    <div class="mr-brand">
      <span class="mr-pill">FILTER CROSS REFERENCE</span>
      <span class="mr-meta" id="syncStatus">• Memuat data katalog...</span>
    </div>
    <div class="mr-actions">
      <button type="button" class="btn btn-ghost" onclick="openApiConfig()">
        <i class="bi bi-link-45deg"></i> API URL
      </button>
      <button type="button" class="btn btn-ghost" onclick="loadData(true)">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button type="button" class="btn btn-primary" onclick="exportToExcel()">
        <i class="bi bi-file-earmark-excel"></i> Export .xlsx
      </button>
    </div>
  </header>

  <section class="mr-toolbar crossref-toolbar">
    <form class="crossref-search" id="filterForm">
      <label class="crossref-search-field" for="filterType">
        <span>TYPE (ENGINE/MODEL)</span>
        <input id="filterType" class="ctrl-input" type="search"
          placeholder="Contoh: C15..." autocomplete="off" />
      </label>
      <label class="crossref-search-field" for="filterName">
        <span>NAMA ITEM</span>
        <input id="filterName" class="ctrl-input" type="search"
          placeholder="Contoh: Oil Filter..." autocomplete="off" />
      </label>
      <label class="crossref-search-field" for="filterPartNo">
        <span>PART NUMBER</span>
        <input id="filterPartNo" class="ctrl-input" type="search"
          placeholder="Ketik Part No (misal: 1R1414)..." autocomplete="off" />
      </label>
      <button type="submit" class="btn btn-primary crossref-search-button">
        <i class="bi bi-search"></i> Cari
      </button>
    </form>
  </section>

  <main class="crossref-panel">
    <div class="panel-head">
      <span><i class="bi bi-funnel"></i> Daftar Persamaan Filter</span>
      <span class="badge-count" id="resultMeta">0 data</span>
    </div>
    <div class="crossref-results" id="crossrefResults" aria-live="polite">
      <div class="empty-box">Memuat daftar referensi...</div>
    </div>
    <div class="crossref-footer">
      <span id="showingMeta">Menampilkan 0 data</span>
      <button type="button" class="btn btn-ghost btn-sm" id="btnLoadMore" onclick="showMore()" hidden>
        Tampilkan data berikutnya
      </button>
    </div>
  </main>

  <div class="api-config-backdrop" id="apiConfigBackdrop" hidden>
    <section class="api-config-card" role="dialog" aria-modal="true" aria-labelledby="apiConfigTitle">
      <div class="api-config-heading">
        <div>
          <h2 id="apiConfigTitle">Pengaturan API FilterCrossRef</h2>
          <p>Gunakan URL Web App GAS yang berakhiran <code>/exec</code>.</p>
        </div>
        <button type="button" class="api-config-close" onclick="closeApiConfig()" aria-label="Tutup">&times;</button>
      </div>
      <label for="apiUrlInput">URL Web App GAS</label>
      <input id="apiUrlInput" class="ctrl-input" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
      <div class="api-config-actions">
        <button type="button" class="btn btn-ghost" onclick="closeApiConfig()">Batal</button>
        <button type="button" class="btn btn-primary" onclick="saveApiConfig()">Simpan URL</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
